name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '.changeset/*.md'
      - '.claude/**'
      - '.githooks/**'
      - 'context/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'ROADMAP.md'
  pull_request:
    paths-ignore:
      - '.changeset/*.md'
      - '.claude/**'
      - '.githooks/**'
      - 'context/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'ROADMAP.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate spec + integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install deps
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Parse-check every JSON schema
        run: |
          fail=0
          while IFS= read -r f; do
            if ! bun -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" 2>/dev/null; then
              echo "::error file=$f::invalid JSON"
              fail=1
            fi
          done < <(find spec/schemas -name '*.schema.json')
          exit $fail

      # Spec integrity (index hashes + coverage matrix) and the public-site
      # build (schema $id alignment) are now covered by `bun run validate`
      # in the build-test job — the spec and web workspaces validate
      # themselves end-to-end. Only the JSON parse-check stays here as a
      # cheap, install-script-free guard so a malformed schema fails the
      # validate job before the heavier orchestrator runs.

  build-test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install deps
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate (typecheck + lint + build + test for every workspace)
        run: bun run validate

  smoke-install:
    name: smoke install (tarball)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install deps
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build (tsup)
        run: bun run --filter @skill-map/cli build

      - name: Pack workspaces
        run: |
          mkdir -p .tmp/packs
          (cd spec && bun pm pack --destination ../.tmp/packs)
          (cd src && bun pm pack --destination ../.tmp/packs)

      - name: Verify tarball contents
        run: |
          (cd src && bun pm pack --dry-run --json) | bun -e '
            let raw = "";
            process.stdin.on("data", (c) => { raw += c; });
            process.stdin.on("end", () => {
              const data = JSON.parse(raw);
              const files = (data.files ?? []).map((f) => f.path ?? f);
              const required = [
                "bin/sm.js",
                "dist/cli.js",
                "dist/index.js",
                "dist/kernel/index.js",
                "dist/conformance/index.js",
                "dist/migrations/001_initial.sql",
                "package.json",
              ];
              const missing = required.filter((r) => !files.includes(r));
              if (missing.length) {
                console.error("Missing in tarball:", missing.join(", "));
                process.exit(1);
              }
              console.log("Tarball contents OK (" + files.length + " files).");
            });
          '

      - name: Install globally from tarballs
        run: |
          spec_tgz=$(ls .tmp/packs/skill-map-spec-*.tgz | head -n 1)
          cli_tgz=$(ls .tmp/packs/skill-map-cli-*.tgz | head -n 1)
          bun install -g "$spec_tgz" "$cli_tgz"

      - name: Verify CLI surface
        run: |
          sm --version
          skill-map --version
          sm --help > /dev/null
          test -f "$(bun pm -g bin)/../lib/node_modules/@skill-map/cli/dist/migrations/001_initial.sql" \
            || test -f "$HOME/.bun/install/global/node_modules/@skill-map/cli/dist/migrations/001_initial.sql"

      - name: Verify init + scan flow on a temp dir
        run: |
          workdir=$(mktemp -d)
          cd "$workdir"
          # CLAUDE.md is Claude's documented project-context file and one of
          # the few `.md` paths the Claude Provider claims at the project
          # root (along with `.claude/`, `notes/`). Since multi-provider
          # tightened classify() to disclaim foreign paths, an arbitrary
          # `a.md` in root would be skipped by every Provider and yield 0
          # nodes — defeating the smoke test.
          echo "# hello" > CLAUDE.md
          sm init --no-scan
          test -f .skill-map/skill-map.db
          sm scan --json . > scan.json
          test -s scan.json
          bun -e '
            const r = JSON.parse(require("fs").readFileSync("scan.json", "utf8"));
            if (!Array.isArray(r.nodes) || r.nodes.length === 0) {
              console.error("scan output missing nodes[]");
              process.exit(1);
            }
            console.log("scan produced " + r.nodes.length + " node(s).");
          '

  changeset:
    name: require changeset on PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install deps
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Check for changeset
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: bun scripts/check-changeset.js "origin/${BASE_REF}"
