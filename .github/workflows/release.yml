name: release

on:
  push:
    branches: [main]
    paths:
      - '.changeset/*.md'
      - '*/package.json'
      - 'package.json'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install deps
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build UI
        # The CLI publish step depends on the Angular SPA being built so
        # tsup's onSuccess hook can copy `ui/dist/ui/browser/` into
        # `src/dist/ui/`. The runtime resolver in `src/server/paths.ts`
        # serves the bundle from there in installed mode; without this
        # step the published tarball would ship without any UI and
        # `sm` would render the placeholder forever.
        run: bun run --filter ui build

      - name: Build CLI
        run: bun run --filter @skill-map/cli build

      - name: Verify spec index is up to date
        run: bun run --filter @skill-map/spec spec:check

      - name: Changesets — version PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run release:version
          publish: bun run release:publish
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Smoke install from npm (post-publish)
        if: steps.changesets.outputs.published == 'true'
        run: |
          # Allow npm registry propagation before pulling the freshly
          # published versions. The publish itself just returned, but the
          # CDN can lag a few seconds before the new tag resolves.
          sleep 60
          bun install -g @skill-map/cli@latest
          sm --version
          skill-map --version
          sm --help > /dev/null
