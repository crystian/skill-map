<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64" fill="none">
  <!--
    blueprint-theme favicon. Activated by `ThemeService` (effect) when
    `extraTheme === 'blueprint'`, swapped back to `favicon.svg` when the
    theme clears. Stroke ramp mirrors `skill-map-mark-blueprint.svg` so
    the tab glyph reads as the same brand mark in the theme's ink.
  -->
  <line x1="16" y1="20" x2="48" y2="20" stroke="#7DD3FC" stroke-width="3.5" stroke-linecap="round" />
  <line x1="16" y1="20" x2="32" y2="48" stroke="#7DD3FC" stroke-width="3.5" stroke-linecap="round" />
  <line x1="48" y1="20" x2="32" y2="48" stroke="#7DD3FC" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="16" cy="20" r="6" fill="#7DD3FC" />
  <circle cx="48" cy="20" r="6" fill="#7DD3FC" />
  <circle cx="32" cy="48" r="8" fill="#E0F2FE" />
</svg>
